<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
window.OD_VERSION='0.1'; window.OD_BUILD=1;
/* If an update was installed in the browser, run that newer build instead of this file. */
(function(){try{var u=JSON.parse(localStorage.getItem('od_update')||'null');if(u&&u.build>window.OD_BUILD&&u.html){document.open();document.write(u.html);document.close();}}catch(e){}})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OpenDesk beta 0.1</title>
<style>
:root{ --bar-h:26px; --accent:#0a84ff; --dsize:48px; color-scheme: light dark; }
*{box-sizing:border-box;}
html,body{height:100%;margin:0;overflow:hidden;font-family:-apple-system,"SF Pro Text",Helvetica,Arial,sans-serif;}
body{background:radial-gradient(circle at 30% 20%,#7b5cff,#1b1035 70%);user-select:none;transition:background 1s,filter .2s;}
#menubar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;height:var(--bar-h);background:rgba(28,28,32,.55);backdrop-filter:blur(20px);display:flex;align-items:center;justify-content:space-between;padding:0 12px;font-size:13px;font-weight:500;color:#f2f2f2;z-index:9000;}
#menubar .left,#menubar .right{display:flex;align-items:center;gap:2px;}
#menubar .mi{padding:2px 9px;border-radius:5px;cursor:pointer;}
#menubar .mi:hover,#menubar .mi.on{background:rgba(255,255,255,.18);}
#menubar .app-name{font-weight:700;margin-right:4px;}
#menubar .right .mi{font-size:13px;}
#clock{font-variant-numeric:tabular-nums;cursor:pointer;padding:2px 8px;border-radius:5px;}
#clock:hover{background:rgba(255,255,255,.18);}
.beta-tag.upd{background:#ff9f0a;color:#1c1c1e;cursor:pointer;}
.upd-card{background:rgba(120,120,128,.14);border-radius:12px;padding:14px;display:flex;gap:14px;align-items:center;margin-bottom:14px;}
.upd-card .st{font-size:12px;margin-top:3px;}
.upd-btn{border:0;border-radius:7px;padding:6px 14px;font-size:12.5px;cursor:pointer;background:var(--accent);color:#fff;margin-top:8px;margin-right:6px;}
.upd-btn.sec{background:rgba(120,120,128,.25);color:inherit;}
.upd-btn:disabled{opacity:.5;cursor:default;}
.beta-tag{font-size:9px;font-weight:700;color:#c9b8ff;background:rgba(255,255,255,.12);border-radius:4px;padding:1px 5px;margin-right:8px;letter-spacing:.03em;}
#desktop{position:absolute;top:var(--bar-h);left:0;right:0;bottom:78px;overflow:hidden;}
.dicon{position:absolute;width:78px;text-align:center;color:#fff;font-size:12px;text-shadow:0 1px 3px rgba(0,0,0,.7);cursor:pointer;padding:6px 2px;border-radius:8px;}
.dicon.sel,.dicon:active{background:rgba(255,255,255,.22);}
.dicon .glyph{font-size:34px;display:flex;justify-content:center;margin-bottom:4px;}
.win{position:absolute;min-width:320px;min-height:220px;background:rgba(246,246,248,.95);backdrop-filter:blur(18px);border-radius:10px;box-shadow:0 20px 50px rgba(0,0,0,.4);display:flex;flex-direction:column;overflow:hidden;transition:transform .22s ease,opacity .22s ease;}
.win.minimizing{transform:scale(.05) translateY(600px);opacity:0;}
.win.opening{animation:pop .18s ease;}
@keyframes pop{from{transform:scale(.9);opacity:0;}to{transform:scale(1);opacity:1;}}
.titlebar{height:32px;display:flex;align-items:center;padding:0 10px;gap:8px;background:rgba(230,230,232,.9);border-bottom:1px solid rgba(0,0,0,.08);cursor:grab;flex-shrink:0;}
.tl{width:12px;height:12px;min-width:12px;border-radius:50%;border:0;padding:0;margin:0;cursor:pointer;position:relative;font-size:10px;font-weight:700;font-family:Arial,Helvetica,sans-serif;color:transparent;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tl>i{font-style:normal;display:block;line-height:1;transform:translateY(1.7px);}
.tl.close{background:#ff5f57;} .tl.min{background:#febc2e;} .tl.zoom{background:#28c840;}
.titlebar:hover .tl{color:rgba(0,0,0,.5);}
.wtitle{flex:1;text-align:center;font-size:12.5px;color:#333;font-weight:600;margin-right:36px;}
.wbody{flex:1;overflow:auto;background:#fff;font-size:13px;position:relative;}
.resize{position:absolute;right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;}
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:6px;display:flex;align-items:flex-end;gap:9px;padding:7px 12px;background:rgba(20,20,24,.5);backdrop-filter:blur(22px);border-radius:18px;z-index:9000;padding-bottom:calc(7px + env(safe-area-inset-bottom,0px));overflow:visible;}
body.no-dockbg #dock{background:none;backdrop-filter:none;}
.dock-item{--w:min(var(--dsize),calc((100vw - 70px)/14 - 9px));width:var(--w);height:var(--w);transform-origin:50% 100%;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:calc(var(--w)*0.52);cursor:pointer;box-shadow:0 3px 6px rgba(0,0,0,.35);transition:transform .12s ease;position:relative;flex-shrink:0;}
.dock-item:hover{transform:scale(var(--dzoom,1.35));z-index:5;}
body.no-dockzoom .dock-item:hover{transform:none;}
.dock-item .dot{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:#fff;}
.dock-item.pk{box-shadow:none;background:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.4));}
.dock-item.pk img{width:100%;height:100%;display:block;}
.dock-sep{width:1px;align-self:center;height:38px;background:rgba(255,255,255,.25);flex-shrink:0;}
/* dropdown menus */
.menu-dd{position:fixed;background:rgba(36,36,40,.98);backdrop-filter:blur(14px);border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.45);padding:5px;font-size:12.5px;z-index:99999;min-width:200px;color:#eee;}
.menu-dd .it{display:flex;justify-content:space-between;gap:16px;padding:6px 12px;border-radius:5px;cursor:pointer;}
.menu-dd .it:hover{background:var(--accent);}
.menu-dd .it.off{opacity:.35;cursor:default;}
.menu-dd .it.off:hover{background:none;}
.menu-dd .sc{opacity:.6;font-size:11px;}
.menu-dd hr{border:0;border-top:1px solid rgba(255,255,255,.12);margin:4px 2px;}
/* control / notification centers */
.flyout{position:fixed;top:32px;right:10px;width:300px;background:rgba(36,36,40,.85);backdrop-filter:blur(24px);border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.45);padding:14px;color:#eee;z-index:99999;font-size:13px;}
.flyout h4{margin:0 0 10px;font-size:13px;opacity:.7;font-weight:600;}
.cc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.cc-tile{background:rgba(255,255,255,.08);border-radius:12px;padding:10px;cursor:pointer;}
.cc-tile.on{background:var(--accent);}
.cc-tile .t1{font-size:18px;margin-bottom:6px;}
.cc-tile .t2{font-size:11.5px;font-weight:600;}
.cc-tile .t3{font-size:10px;opacity:.65;}
.cc-slider{background:rgba(255,255,255,.08);border-radius:12px;padding:10px 12px;margin-bottom:10px;display:flex;align-items:center;gap:10px;}
.cc-slider input{flex:1;}
.cc-row{background:rgba(255,255,255,.08);border-radius:12px;padding:10px 12px;margin-bottom:10px;display:flex;align-items:center;gap:10px;}
.cc-row .t1{font-size:18px;}
.cc-row .col{flex:1;}
.cc-row .t2{font-size:11.5px;font-weight:600;margin-bottom:4px;}
.cc-row input{width:100%;}
#menuLogo{margin:0 1px;}
.launcher-ic{display:inline-grid;grid-template-columns:5px 5px;gap:3px;width:16px;height:16px;align-content:center;justify-content:center;vertical-align:-3px;}
.launcher-ic i{width:5px;height:5px;background:#fff;border-radius:1px;display:block;}
.theme-card{width:110px;height:70px;border-radius:10px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-size:12px;cursor:pointer;border:2px solid transparent;}
.theme-card.sel{border-color:var(--accent);}
body.theme-dark .win{background:rgba(40,40,42,.94);color:#eee;}
body.theme-dark .wbody{background:#242426;color:#ddd;}
body.theme-dark .titlebar{background:rgba(56,56,58,.9);}
body.theme-dark .wtitle{color:#eee;}
body.theme-dark .finder .sb,body.theme-dark .notes .list,body.theme-dark .settings .sn,body.theme-dark .finder .tb,body.theme-dark .textedit .tb,body.theme-dark .mail .ml,body.theme-dark .msg .cl,body.theme-dark .safari .ab,body.theme-dark .safari .bm{background:#2c2c2e;border-color:#3a3a3c;color:#ddd;}
body.theme-dark .finder .fl .fitem,body.theme-dark .settings .sc{color:#ddd;}
body.theme-dark .textedit textarea,body.theme-dark .msg .in input,body.theme-dark .safari .ab input{background:#242426;color:#eee;}
body.theme-dark .settings label{border-color:#3a3a3c;}
body.theme-dark .settings .sn div:hover:not(.active){background:#3a3a3c;}
.nc-card{background:rgba(255,255,255,.08);border-radius:10px;padding:9px 10px;margin-bottom:8px;display:flex;gap:9px;align-items:flex-start;}
.nc-card .ic{width:26px;height:26px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;}
.nc-card .body{flex:1;font-size:12px;}
.nc-card .ti{font-weight:600;display:flex;justify-content:space-between;}
.nc-card .ti span:last-child{opacity:.5;font-weight:400;font-size:10.5px;}
.nc-card .x{cursor:pointer;opacity:.5;font-size:12px;}
/* modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:99998;display:flex;align-items:center;justify-content:center;}
.modal-box{width:300px;background:rgba(246,246,248,.98);border-radius:11px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.4);}
.modal-box .titlebar{background:rgba(230,230,232,.9);}
.modal-box .mbody{padding:16px;display:flex;gap:12px;}
.modal-box .mic{width:40px;height:40px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;}
.modal-box .mtext h4{margin:0 0 4px;font-size:13px;}
.modal-box .mtext p{margin:0;font-size:12px;color:#555;}
.modal-btns{display:flex;justify-content:flex-end;gap:8px;padding:0 16px 16px;}
.modal-btns button{border:0;border-radius:6px;padding:6px 14px;font-size:12.5px;cursor:pointer;}
.modal-btns .cancel{background:#e2e2e4;}
.modal-btns .danger{background:#ff5f57;color:#fff;}
.modal-btns .primary{background:var(--accent);color:#fff;}
/* generic finder-ish */
.finder{display:flex;height:100%;flex-direction:column;}
.finder .tb{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid #ddd;background:#f7f7f8;font-size:12px;}
.finder .tb button{border:0;background:#e4e4e6;border-radius:5px;padding:3px 8px;cursor:pointer;}
.finder .main{display:flex;flex:1;overflow:hidden;}
.finder .sb{width:120px;background:#eef0f2;border-right:1px solid #ddd;padding:8px;font-size:12px;color:#444;overflow:auto;}
.finder .sb div{padding:5px 6px;border-radius:5px;cursor:pointer;}
.finder .sb div:hover,.finder .sb div.on{background:#dde3ea;}
.finder .fl{flex:1;padding:14px;display:grid;grid-template-columns:repeat(auto-fill,74px);gap:14px;align-content:start;overflow:auto;}
.finder .fl .fitem{text-align:center;font-size:11px;color:#333;cursor:pointer;padding:4px;border-radius:6px;}
.finder .fl .fitem:hover{background:#eef2f8;}
.finder .fl .fitem span{font-size:32px;display:block;}
.notes{display:flex;height:100%;}
.notes .list{width:140px;background:#faf6e3;border-right:1px solid #e5dfc0;overflow:auto;display:flex;flex-direction:column;}
.notes .list .n{padding:8px;font-size:12px;border-bottom:1px solid #eee5c0;cursor:pointer;}
.notes .list .n.active{background:#f7e79a;}
.notes .list .add{padding:8px;text-align:center;font-weight:700;cursor:pointer;color:#8a7b1e;}
.notes .col{flex:1;display:flex;flex-direction:column;}
.notes .tb{display:flex;justify-content:space-between;padding:4px 8px;border-bottom:1px solid #eee;font-size:11px;color:#999;}
.notes textarea{flex:1;border:0;resize:none;padding:14px;font-size:14px;outline:none;font-family:inherit;background:#fffdf2;}
.calc{background:#1c1c1e;height:100%;display:flex;flex-direction:column;padding:10px;}
.calc .disp{color:#fff;font-size:34px;text-align:right;padding:14px 10px;font-weight:300;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.calc .grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.calc button{border:0;border-radius:50%;font-size:18px;color:#fff;background:#505050;cursor:pointer;}
.calc button.op{background:#ff9f0a;} .calc button.fn{background:#a5a5a5;color:#000;} .calc button.zero{grid-column:span 2;border-radius:20px;text-align:left;padding-left:22px;}
.term{background:#161616;color:#4ce680;height:100%;font-family:"SF Mono",Menlo,monospace;font-size:13px;padding:10px;overflow:auto;}
.term .line{white-space:pre-wrap;}
.term input{background:transparent;border:0;outline:none;color:#4ce680;font:inherit;flex:1;}
.term .row{display:flex;}
.textedit{height:100%;display:flex;flex-direction:column;}
.textedit .tb{padding:6px 10px;border-bottom:1px solid #ddd;font-size:12px;color:#666;background:#f4f4f4;display:flex;gap:10px;align-items:center;}
.textedit .tb button{border:0;background:#e4e4e6;border-radius:5px;padding:3px 9px;cursor:pointer;font-size:11.5px;}
.textedit textarea{flex:1;border:0;outline:none;padding:16px;font-size:14px;resize:none;font-family:Georgia,serif;line-height:1.5;}
.settings{display:flex;height:100%;}
.settings .sn{width:150px;background:#eef0f2;border-right:1px solid #ddd;padding:10px;font-size:12.5px;}
.settings .sn div{padding:7px 8px;border-radius:6px;cursor:pointer;margin-bottom:2px;}
.settings .sn div.active{background:var(--accent);color:#fff;}
.settings .sc{flex:1;padding:20px;font-size:13px;color:#333;overflow:auto;}
.settings .sc h3{margin-top:0;}
.settings label{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee;}
.swatch{display:inline-block;width:24px;height:24px;border-radius:50%;margin-right:8px;cursor:pointer;border:2px solid transparent;}
.swatch.sel{border-color:#333;}
.toggle{width:38px;height:22px;border-radius:11px;background:#ccc;position:relative;cursor:pointer;flex-shrink:0;transition:background .15s;}
.toggle.on{background:var(--accent);}
.toggle .kn{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3);}
.toggle.on .kn{left:18px;}
/* safari */
.safari{display:flex;flex-direction:column;height:100%;}
.safari .ab{display:flex;gap:6px;padding:7px 10px;border-bottom:1px solid #ddd;background:#f2f2f4;}
.safari .ab input{flex:1;border:1px solid #ddd;border-radius:6px;padding:4px 10px;font-size:12px;outline:none;}
.safari .ab button{border:0;background:var(--accent);color:#fff;border-radius:6px;padding:4px 12px;cursor:pointer;font-size:12px;}
.safari .bm{display:flex;gap:14px;padding:6px 12px;background:#fafafa;border-bottom:1px solid #eee;font-size:11.5px;color:#333;}
.safari .bm span{cursor:pointer;}
.safari .pg{flex:1;overflow:auto;padding:26px;}
/* mail */
.mail{display:flex;height:100%;}
.mail .ml{width:190px;border-right:1px solid #ddd;overflow:auto;background:#f7f7f8;}
.mail .mi{padding:9px 12px;border-bottom:1px solid #eee;cursor:pointer;}
.mail .mi.active{background:#e4edff;}
.mail .mi .f{font-size:12px;font-weight:700;display:flex;justify-content:space-between;}
.mail .mi .s{font-size:11.5px;color:#333;}
.mail .mi .p{font-size:11px;color:#999;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.mail .mr{flex:1;padding:20px;overflow:auto;}
/* messages */
.msg{display:flex;height:100%;}
.msg .cl{width:150px;border-right:1px solid #ddd;background:#f7f7f8;overflow:auto;}
.msg .ci{padding:10px;border-bottom:1px solid #eee;cursor:pointer;font-size:12px;}
.msg .ci.active{background:#e4edff;}
.msg .th{flex:1;display:flex;flex-direction:column;}
.msg .bubbles{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px;}
.msg .b{max-width:70%;padding:8px 12px;border-radius:14px;font-size:13px;}
.msg .b.me{align-self:flex-end;background:var(--accent);color:#fff;}
.msg .b.them{align-self:flex-start;background:#e5e5ea;color:#111;}
.msg .in{display:flex;gap:8px;padding:8px;border-top:1px solid #ddd;}
.msg .in input{flex:1;border:1px solid #ddd;border-radius:14px;padding:6px 12px;font-size:13px;outline:none;}
/* photos */
.photos{padding:14px;display:grid;grid-template-columns:repeat(auto-fill,90px);gap:10px;height:100%;overflow:auto;align-content:start;}
.photos .ph{width:90px;height:90px;border-radius:8px;cursor:pointer;}
.lightbox{position:absolute;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:50;}
.lightbox .big{width:260px;height:260px;border-radius:10px;}
.lightbox .nav{position:absolute;top:50%;color:#fff;font-size:26px;cursor:pointer;padding:10px;}
.lightbox .nav.l{left:10px;} .lightbox .nav.r{right:10px;}
.lightbox .cl{position:absolute;top:10px;right:16px;color:#fff;font-size:20px;cursor:pointer;}
/* calendar */
.cal{padding:16px;height:100%;overflow:auto;}
.cal .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700;}
.cal .grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
.cal .dow{font-size:10.5px;color:#999;padding:4px 0;}
.cal .day{position:relative;padding:8px 0;border-radius:6px;cursor:pointer;font-size:12.5px;}
.cal .day:hover{background:#eef2f8;}
.cal .day.today{background:var(--accent);color:#fff;}
.cal .day.sel{outline:2px solid var(--accent);}
.cal .day .d{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:#ff5f57;}
.cal .events{margin-top:14px;}
.cal .events input{width:100%;border:1px solid #ddd;border-radius:6px;padding:6px;font-size:12px;margin-top:6px;}
.blackout{position:fixed;inset:0;background:#000;z-index:999999;color:#ccc;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;gap:10px;cursor:pointer;}
</style>
</head>
<body>

<div id="menubar">
  <div class="left">
    <span class="mi" id="appleBtn"><img id="menuLogo" alt="OpenDesk" style="width:17px;height:17px;display:block;"></span>
    <span class="app-name" id="activeAppName">Finder</span>
    <span class="mi" data-menu="file">File</span>
    <span class="mi" data-menu="edit">Edit</span>
    <span class="mi" data-menu="view">View</span>
    <span class="mi" data-menu="go">Go</span>
    <span class="mi" data-menu="window">Window</span>
    <span class="mi" data-menu="help">Help</span>
  </div>
  <div class="right">
    <span class="beta-tag" id="betaTag" title="OpenDesk version"></span>
    <span class="mi" id="wifiBtn" title="Wi-Fi">&#128225;</span>
    <span class="mi" id="btBtn" title="Bluetooth">&#128246;</span>
    <span class="mi" id="ccBtn" title="Control Center">&#9881;&#65039;</span>
    <span class="mi" id="ncBtn" title="Notification Center">&#128276;</span>
    <span id="clock">--:--</span>
  </div>
</div>

<div id="desktop"></div>

function imgTag(k,s){ return '<img src="'+IMG[k]+'" style="width:'+s+'px;height:'+s+'px;display:block;" draggable="false">'; }
function wallCSS(g){ if(g&&g.startsWith('img:')) return 'url('+IMG.walls[parseInt(g.slice(4))]+') center/cover no-repeat'; return 'radial-gradient(circle at 30% 20%,'+g.split(',')[0]+','+g.split(',')[1]+' 70%)'; }
/* ---------- persistence ---------- */
function ls_get(k,fallback){ try{ const v=localStorage.getItem('od_'+k); return v===null?fallback:JSON.parse(v); }catch(e){ return fallback; } }
function ls_set(k,v){ try{ localStorage.setItem('od_'+k, JSON.stringify(v)); }catch(e){} }

/* ---------- window manager ---------- */
let z=100, offset=20;
const openWins={};

function makeWindow(id,title,w,h,bodyHTML){
  const existing=document.getElementById('win-'+id);
  if(existing){ if(existing.style.display==='none'){ existing.style.display='flex'; } focusWin(id); return existing; }
  const win=document.createElement('div');
  win.className='win opening'; win.id='win-'+id;
  win.style.width=w+'px'; win.style.height=h+'px';
  win.style.left=(60+offset)+'px'; win.style.top=(46+offset%200)+'px';
  offset=(offset+30)%180;
  win.style.zIndex=++z;
  win.innerHTML=`<div class="titlebar" data-id="${id}">
    <button class="tl close" onclick="closeWin('${id}')"><i>&times;</i></button>
    <button class="tl min" onclick="minWin('${id}')"><i>&minus;</i></button>
    <button class="tl zoom" onclick="zoomWin('${id}')"><i>+</i></button>
    <div class="wtitle">${title}</div>
  </div>
  <div class="wbody">${bodyHTML}</div>
  <div class="resize"></div>`;
  document.body.appendChild(win);
  makeDraggable(win); makeResizable(win);
  win.addEventListener('mousedown',()=>focusWin(id));
  document.getElementById('activeAppName').textContent=title;
  openWins[id]=title; updateDockDots();
  return win;
}
function focusWin(id){
  const w=document.getElementById('win-'+id);
  if(w){ w.style.zIndex=++z; document.getElementById('activeAppName').textContent=w.querySelector('.wtitle').textContent; }
}
function closeWin(id){ const w=document.getElementById('win-'+id); if(w) w.remove(); delete openWins[id]; updateDockDots(); }
function minWin(id){
  const w=document.getElementById('win-'+id); if(!w) return;
  w.classList.add('minimizing');
  setTimeout(()=>{ w.style.display='none'; w.classList.remove('minimizing'); },220);
}
function minimizeAll(){ Object.keys(openWins).forEach(minWin); }
function zoomWin(id){
  const w=document.getElementById('win-'+id); if(!w) return;
  if(w.dataset.zoomed){
    w.style.width=w.dataset.pw; w.style.height=w.dataset.ph; w.style.left=w.dataset.pl; w.style.top=w.dataset.pt;
    w.dataset.zoomed='';
  } else {
    w.dataset.pw=w.style.width; w.dataset.ph=w.style.height; w.dataset.pl=w.style.left; w.dataset.pt=w.style.top;

function makeDraggable(win){
  const bar=win.querySelector('.titlebar');
  let sx,sy,ox,oy,dragging=false;
  const start=(cx,cy)=>{ dragging=true; sx=cx; sy=cy; ox=win.offsetLeft; oy=win.offsetTop; win.style.zIndex=++z; };
  const move=(cx,cy)=>{ if(!dragging) return; win.style.left=(ox+cx-sx)+'px'; win.style.top=Math.max(26,oy+cy-sy)+'px'; };
  bar.addEventListener('mousedown',e=>{ if(e.target.classList.contains('tl'))return; start(e.clientX,e.clientY); e.preventDefault(); });
  window.addEventListener('mousemove',e=>move(e.clientX,e.clientY));
  window.addEventListener('mouseup',()=>dragging=false);
  bar.addEventListener('touchstart',e=>{ const t=e.touches[0]; start(t.clientX,t.clientY); },{passive:true});
  window.addEventListener('touchmove',e=>{ const t=e.touches[0]; move(t.clientX,t.clientY); },{passive:true});
  window.addEventListener('touchend',()=>dragging=false);
}
function makeResizable(win){
  const handle=win.querySelector('.resize');
  let sx,sy,ow,oh,rs=false;
  handle.addEventListener('mousedown',e=>{ rs=true; sx=e.clientX; sy=e.clientY; ow=win.offsetWidth; oh=win.offsetHeight; e.stopPropagation(); e.preventDefault(); });
  window.addEventListener('mousemove',e=>{ if(!rs) return; win.style.width=Math.max(300,ow+e.clientX-sx)+'px'; win.style.height=Math.max(200,oh+e.clientY-sy)+'px'; });
  window.addEventListener('mouseup',()=>rs=false);
}

/* ---------- software update ---------- */
const UPD={state:'idle',info:null,err:'',busy:false};
function updUrl(){ return (ls_get('updateUrl','')||'').trim() || 'version.json'; }
function refreshTag(){
  const t=document.getElementById('betaTag'); if(!t) return;
  if(UPD.state==='available'){ t.textContent='Update available'; t.classList.add('upd'); t.title='Click to update OpenDesk'; }
  else { t.textContent='OpenDesk beta '+OD_VERSION; t.classList.remove('upd'); t.title='OpenDesk version'; }
}
document.addEventListener('click',e=>{ if(e.target.id==='betaTag' && UPD.state==='available'){ e.stopPropagation(); openSettings('general'); } });
async function checkUpdate(silent){
  UPD.state='checking'; refreshUpdUI();
  try{
    const r=await fetch(updUrl(),{cache:'no-store'}); if(!r.ok) throw new Error('Update server answered '+r.status);
    const j=await r.json(); if(typeof j.build!=='number') throw new Error('That is not a valid version.json');
    UPD.info=j; const was=UPD.state;
    if(j.build>OD_BUILD){ UPD.state='available'; if(!UPD.notified){ UPD.notified=true; pushNotification('System Settings','OpenDesk beta '+j.version+' is available. Open Settings → General to update.',imgTag('settings',26),'transparent'); } }
    else UPD.state='current';
  }catch(e){ UPD.state='error'; UPD.err=e.message||'Could not reach the update server'; }
  refreshTag(); refreshUpdUI(); return UPD.state;
}
async function installUpdate(){
  if(UPD.busy||!UPD.info) return; UPD.busy=true; refreshUpdUI('Downloading beta '+UPD.info.version+'…');
  try{
    const base=new URL(updUrl(),location.href);
    const fileUrl=new URL(UPD.info.file||'index.html',base).href;
    const r=await fetch(fileUrl,{cache:'no-store'}); if(!r.ok) throw new Error('Download failed ('+r.status+')');
    const html=await r.text();
    const m=html.match(/OD_BUILD=(\d+)/); if(!m||parseInt(m[1])<=OD_BUILD) throw new Error('The downloaded file is not a newer OpenDesk build');
    ls_set('update',{build:parseInt(m[1]),version:UPD.info.version,html});
    if(!ls_get('update',null)) throw new Error('Not enough browser storage to keep the update');
    UPD.busy=false;
    showModal({heading:'Update installed',message:'OpenDesk beta '+UPD.info.version+' is ready. Restart to start using it.',icon:imgTag('logoW',26),iconBg:'#1c1c1e',
      buttons:[{label:'Later',cls:'cancel'},{label:'Restart Now',cls:'primary',action:()=>location.reload()}]});
  }catch(e){ UPD.busy=false; UPD.state='error'; UPD.err=e.message; refreshUpdUI(); }
}
function refreshUpdUI(msg){
  const el=document.getElementById('updCard'); if(!el) return;
  let line='', color='#999', btns='';
  const i=UPD.info;
  if(msg){ line=msg; }
  else if(UPD.state==='checking'){ line='Checking for updates…'; }
  else if(UPD.state==='available'){ color='#ff9f0a'; line='<b>Outdated.</b> You have beta '+OD_VERSION+' — beta '+i.version+' is available.'+(i.notes?'<br><span style="opacity:.75">'+String(i.notes).replace(/</g,'&lt;')+'</span>':''); btns='<button class="upd-btn" id="updGo">Update Now</button><button class="upd-btn sec" id="updChk">Check Again</button>'; }
  else if(UPD.state==='current'){ color='#30d158'; line='Up to date — beta '+OD_VERSION+' is the latest version.'; btns='<button class="upd-btn sec" id="updChk">Check Again</button>'; }
  else if(UPD.state==='error'){ color='#ff453a'; line='Couldn’t check for updates. '+UPD.err; btns='<button class="upd-btn sec" id="updChk">Try Again</button>'; }
  else { line='Not checked yet.'; btns='<button class="upd-btn" id="updChk">Check for Updates</button>'; }
  el.querySelector('.st').style.color=color; el.querySelector('.st').innerHTML=line; el.querySelector('.btns').innerHTML=btns;
  const g=el.querySelector('#updGo'); if(g) g.onclick=installUpdate;
  const c=el.querySelector('#updChk'); if(c) c.onclick=()=>checkUpdate();
}

const FS_DEFAULT={
  '/':{type:'dir',children:['Desktop','Documents','Downloads','Pictures','Music']},
  '/Desktop':{type:'dir',children:[]},
  '/Documents':{type:'dir',children:['Resume.txt','Notes.txt']},
  '/Documents/Resume.txt':{type:'file',content:'Your Name\nSoftware things.\n\n(edit me in TextEdit)'},
  '/Documents/Notes.txt':{type:'file',content:'Quick scratchpad file.'},
  '/Downloads':{type:'dir',children:[]},
  '/Pictures':{type:'dir',children:['sunset.jpg']},
  '/Pictures/sunset.jpg':{type:'file',content:'[binary image data]'},
  '/Music':{type:'dir',children:['song.mp3']},
  '/Music/song.mp3':{type:'file',content:'[binary audio data]'}
};
let FS = ls_get('fs', null) || JSON.parse(JSON.stringify(FS_DEFAULT));
function fsSave(){ ls_set('fs', FS); }
function fsJoin(base,name){ return (base==='/'? '' : base)+'/'+name; }
function fsList(path){ const n=FS[path]; return n && n.type==='dir' ? n.children.slice() : null; }

/* ---------- Finder ---------- */
function openFinder(startPath){
  const w=makeWindow('finder','Finder',520,340,`
  <div class="finder">
    <div class="tb"><button id="fBack">&larr;</button><span id="fPath">/</span></div>
    <div class="main">
      <div class="sb">
        <div data-p="/Desktop">&#127968; Desktop</div>
        <div data-p="/Documents">&#128196; Documents</div>
        <div data-p="/Downloads">&#11015; Downloads</div>
        <div data-p="/Pictures">&#128444; Pictures</div>
        <div data-p="/Music">&#127925; Music</div>
      </div>
      <div class="fl" id="fList"></div>
    </div>
  </div>`);
  if(!w) return;
  let path = startPath || '/Documents';
  const list=w.querySelector('#fList'), pathEl=w.querySelector('#fPath'), sb=w.querySelector('.sb');
  function icon(node,name){ const m={Documents:'documents',Downloads:'downloads',Pictures:'pictures',Music:'music'}; const k=node.type==='dir'?(m[name]||'folder'):(name.endsWith('.jpg')?'pictures':name.endsWith('.mp3')?'music':'documents'); return imgTag(k,48); }
  function render(){
    pathEl.textContent=path;
    sb.querySelectorAll('div').forEach(d=>d.classList.toggle('on', d.dataset.p===path));
    list.innerHTML='';
    const children=fsList(path)||[];
    children.forEach(name=>{
      const full=fsJoin(path,name); const node=FS[full];
      const it=document.createElement('div'); it.className='fitem';
      it.innerHTML=`<span style="display:flex;justify-content:center;">${icon(node,name)}</span>${name}`;
      it.ondblclick=()=>{ if(node.type==='dir'){ path=full; render(); } else openTextEdit(full); };
      list.appendChild(it);
    });
    if(children.length===0){ list.innerHTML='<div style="color:#999;grid-column:1/-1;padding:20px;">This folder is empty</div>'; }
  }
  sb.querySelectorAll('div').forEach(d=>d.onclick=()=>{ path=d.dataset.p; render(); });
  w.querySelector('#fBack').onclick=()=>{ if(path!=='/'){ path=path.substring(0,path.lastIndexOf('/'))||'/'; render(); } };
  render();
}

/* ---------- Notes ---------- */
function openNotes(){
  let notes=ls_get('notes', [ {t:'Welcome',c:'Click + to add a note, and Delete to remove one.'}, {t:'Ideas',c:'Build a small OS UI\nLearn to sail'} ]);
  let active=0;
  const w=makeWindow('notes','Notes',440,320,`
  <div class="notes">
    <div class="list" id="nList"></div>
    <div class="col"><div class="tb"><span id="nTitle">Note</span><span style="cursor:pointer;color:#c0392b;" id="nDel">Delete</span></div><textarea id="nArea"></textarea></div>
  </div>`);
  if(!w) return;
  const list=w.querySelector('#nList'), area=w.querySelector('#nArea'), titleEl=w.querySelector('#nTitle');
  function save(){ ls_set('notes', notes); }
  function render(){
    list.innerHTML='';
    notes.forEach((n,i)=>{
      const d=document.createElement('div'); d.className='n'+(i===active?' active':'');
      d.textContent=n.t||'(untitled)';
      d.onclick=()=>{ active=i; area.value=n.c; titleEl.textContent=n.t; render(); };
      list.appendChild(d);
    });
    const add=document.createElement('div'); add.className='add'; add.textContent='+ New Note';
    add.onclick=()=>{ notes.unshift({t:'New Note',c:''}); active=0; save(); area.value=''; titleEl.textContent='New Note'; render(); };
    list.appendChild(add);
  }
  area.value = notes[active] ? notes[active].c : '';
  titleEl.textContent = notes[active] ? notes[active].t : '';
  area.oninput=()=>{ if(!notes[active]) return; notes[active].c=area.value; const firstLine=area.value.split('\n')[0].slice(0,24)||'New Note'; notes[active].t=firstLine; save(); render(); };
  w.querySelector('#nDel').onclick=()=>{ if(notes.length<=1) return; notes.splice(active,1); active=0; save(); area.value=notes[0].c; titleEl.textContent=notes[0].t; render(); };
  render();
}

/* ---------- Calculator ---------- */
function openCalc(){
  const w=makeWindow('calc','Calculator',240,340,`<div class="calc"><div class="disp" id="calcDisp">0</div><div class="grid" id="calcGrid"></div></div>`);
  if(!w) return;
  const disp=w.querySelector('#calcDisp'), grid=w.querySelector('#calcGrid');
  let cur='0', prev=null, op=null, reset=false;
  const keys=[['AC','fn'],['+/-','fn'],['%','fn'],['÷','op'],['7',''],['8',''],['9',''],['×','op'],['4',''],['5',''],['6',''],['−','op'],['1',''],['2',''],['3',''],['+','op'],['0','zero'],['.',''],['=','op']];
  keys.forEach(([label,cls])=>{
    const b=document.createElement('button'); b.textContent=label; if(cls) b.className=cls;
    if(label==='0') b.classList.add('zero');
    b.onclick=()=>press(label); grid.appendChild(b);
  });
  function calc(a,b,o){ a=parseFloat(a); b=parseFloat(b); if(o==='+') return a+b; if(o==='−') return a-b; if(o==='×') return a*b; if(o==='÷') return b===0?0:a/b; return b; }
  function press(k){
    if(k==='AC'){cur='0';prev=null;op=null;}
    else if(k==='+/-'){cur=(parseFloat(cur)*-1).toString();}
    else if(k==='%'){cur=(parseFloat(cur)/100).toString();}
    else if(['÷','×','−','+'].includes(k)){ if(prev!==null&&op){cur=calc(prev,cur,op).toString();} prev=cur; op=k; reset=true; }
    else if(k==='='){ if(prev!==null&&op){cur=calc(prev,cur,op).toString(); prev=null; op=null;} }
    else if(k==='.'){ if(reset){cur='0';reset=false;} if(!cur.includes('.')) cur+='.'; }
    else { if(reset||cur==='0'){cur=k;reset=false;} else cur+=k; }
    disp.textContent=cur;
  }
}

/* ---------- Terminal ---------- */
function openTerm(){
  const w=makeWindow('term','Terminal — bash',500,320,`
  <div class="term" id="termBody">
    <div class="line">OpenDesk beta ${OD_VERSION} shell. Type "help" for commands.</div>
    <div class="row"><span id="termPrompt">guest@opendesk /&nbsp;%&nbsp;</span><input id="termInput" autocomplete="off"></div>
  </div>`);
  if(!w) return;
  const body=w.querySelector('#termBody'), input=w.querySelector('#termInput'), promptEl=w.querySelector('#termPrompt');
  let cwd='/'; const hist=[]; let hidx=0;
  input.focus();
  function prompt(){ promptEl.textContent=`guest@opendesk ${cwd} % `; }
  function resolve(p){
    if(!p) return cwd;
    if(p==='..'){ if(cwd==='/') return '/'; return cwd.substring(0,cwd.lastIndexOf('/'))||'/'; }
    if(p.startsWith('/')) return p.replace(/\/+$/,'')||'/';
    return (cwd==='/'?'':cwd)+'/'+p;
  }
  input.addEventListener('keydown',e=>{
    if(e.key==='ArrowUp'){ if(hidx>0){hidx--; input.value=hist[hidx]||'';} e.preventDefault(); return; }
    if(e.key==='ArrowDown'){ if(hidx<hist.length){hidx++; input.value=hist[hidx]||'';} e.preventDefault(); return; }
    if(e.key!=='Enter') return;
    const cmdRaw=input.value; const cmd=cmdRaw.trim();
    if(cmd){ hist.push(cmd); hidx=hist.length; }
    const echo=document.createElement('div'); echo.className='line'; echo.textContent=promptEl.textContent+cmdRaw;
    body.insertBefore(echo, input.parentElement);
    const parts=cmd.split(' ').filter(Boolean);
    const c=parts[0]; const arg=parts.slice(1).join(' ');
    let res='';
    if(!c){ input.value=''; return; }
    else if(c==='help') res='Commands: help, ls, cd <dir>, pwd, cat <file>, mkdir <dir>, touch <file>, echo <text>, date, whoami, clear';
    else if(c==='pwd') res=cwd;
    else if(c==='whoami') res='guest';
    else if(c==='date') res=new Date().toString();
    else if(c==='clear'){ body.querySelectorAll('.line').forEach(l=>l.remove()); input.value=''; return; }
    else if(c==='ls'){ const p=resolve(parts[1]); const kids=fsList(p); res = kids ? (kids.join('  ')||'') : 'ls: no such directory'; }
    else if(c==='cd'){ const p=resolve(parts[1]||'/'); if(FS[p]&&FS[p].type==='dir'){ cwd=p; } else res='cd: no such directory'; }
    else if(c==='cat'){ const p=resolve(parts[1]); const n=FS[p]; res = n && n.type==='file' ? n.content : 'cat: no such file'; }
    else if(c==='mkdir'){ const p=resolve(parts[1]); if(!FS[p]){ FS[p]={type:'dir',children:[]}; FS[cwd].children.push(parts[1]); fsSave(); } else res='mkdir: exists'; }
    else if(c==='touch'){ const p=resolve(parts[1]); if(!FS[p]){ FS[p]={type:'file',content:''}; FS[cwd].children.push(parts[1]); fsSave(); } }
    else if(c==='echo') res=arg;
    else res=c+': command not found';
    if(res){ const r=document.createElement('div'); r.className='line'; r.textContent=res; body.insertBefore(r, input.parentElement); }
    input.value=''; prompt(); body.scrollTop=body.scrollHeight;
  });
  prompt();
}

/* ---------- TextEdit ---------- */
function openTextEdit(filePath){
  const path = filePath || '/Documents/Notes.txt';
  const node = FS[path] || {type:'file',content:''};
  const w=makeWindow('textedit-'+path, 'TextEdit — '+path.split('/').pop(), 460,340, `
  <div class="textedit">
    <div class="tb"><button id="teNew">New</button><button id="teSave">Save</button><button id="teDownload">Download .txt</button><span id="teStatus" style="margin-left:auto;color:#999;"></span></div>
    <textarea id="teArea"></textarea>
  </div>`);
  if(!w) return;
  const area=w.querySelector('#teArea'), status=w.querySelector('#teStatus');
  area.value = node.content||'';
  area.oninput=()=>{ status.textContent='Edited (unsaved)'; };
  w.querySelector('#teSave').onclick=()=>{
    FS[path]={type:'file',content:area.value};
    const dir=path.substring(0,path.lastIndexOf('/'))||'/';
    if(FS[dir] && !fsList(dir).includes(path.split('/').pop())) FS[dir].children.push(path.split('/').pop());
    fsSave(); status.textContent='Saved'; pushNotification('TextEdit','Your file has been saved.','&#128196;','#8e8e93');
  };
  w.querySelector('#teNew').onclick=()=>{ openTextEdit('/Documents/Untitled-'+Date.now()+'.txt'); };
  w.querySelector('#teDownload').onclick=()=>{
    const blob=new Blob([area.value],{type:'text/plain'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=path.split('/').pop();
    document.body.appendChild(a); a.click(); a.remove();
  };
}

    gridEl.innerHTML='';

  {id:'messages',img:'messages',glyph:'&#128172;',grad:['#43e97b','#1aab55'],label:'Messages'},
  {id:'photos',img:'photos',glyph:'&#127752;',grad:['#f857a6','#ffb75e','#6a82fb'],label:'Photos',conic:1},
  {id:'calendar',img:'calendar',glyph:'',grad:['#fff','#fff'],label:'Calendar',cal:1},
  {id:'notes',img:'notes',glyph:'&#128221;',grad:['#ffe27a','#e8c400'],label:'Notes'},
  {id:'calc',glyph:'&#128290;',grad:['#3a3a3c','#0a0a0a'],label:'Calculator'},
  {id:'term',glyph:'&#9000;',grad:['#3a3a3c','#0a0a0a'],label:'Terminal'},
  {id:'textedit',img:'documents',glyph:'&#128196;',grad:['#f2f2f2','#c7c7cc'],label:'TextEdit'},
  {id:'files',img:'folder',label:'Files'},
  {id:'sep'},
  {id:'settings',img:'settings',glyph:'&#9881;&#65039;',grad:['#c7c7cc','#8e8e93'],label:'System Settings'},
  {id:'trash',img:'trash',glyph:'&#128465;&#65039;',grad:['#e2e2e4','#aeaeb2'],label:'Trash'}
];
const dock=document.getElementById('dock');
DOCK_APPS.forEach(app=>{
  if(app.id==='sep'){ const s=document.createElement('div'); s.className='dock-sep'; dock.appendChild(s); return; }
  const el=document.createElement('div'); el.className='dock-item'; el.dataset.app=app.id; el.title=app.label;
  if(app.img){ el.classList.add('pk'); el.innerHTML='<img src="'+IMG[app.img]+'" draggable="false">'; }
  else if(app.cal){
    const d=new Date();
    el.style.background='#fff';
    el.innerHTML=`<div style="width:100%;height:100%;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;"><div style="background:#ff3b30;color:#fff;font-size:9px;text-align:center;font-weight:700;padding:2px 0;">${d.toLocaleString('default',{month:'short'}).toUpperCase()}</div><div style="flex:1;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#222;">${d.getDate()}</div></div>`;
  } else if(app.conic){
    el.style.background=`conic-gradient(${app.grad.join(',')})`;
    el.innerHTML=`<span style="filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));">${app.glyph}</span>`;
  } else {
    el.style.background=`linear-gradient(135deg,${app.grad[0]},${app.grad[1]})`;
    el.innerHTML=`<span>${app.glyph}</span>`;
  }
  if(app.id==='trash'){ el.onclick=()=>showModal({heading:'Empty Trash?',message:'Trash is currently empty.',icon:'&#128465;&#65039;',iconBg:'#8e8e93',buttons:[{label:'OK',cls:'primary'}]}); }
  else el.onclick=()=>openApp(app.id);
  dock.appendChild(el);
});

/* ---------- desktop icons (draggable, persisted positions) ---------- */
const desktop=document.getElementById('desktop');
const defaultIcons=[
  {id:'icon-hd',glyph:imgTag('folder',44),label:'Macintosh HD',x:20,y:20,action:()=>openFinder('/')},
  {id:'icon-notes',glyph:imgTag('notes',44),label:'Notes',x:20,y:120,action:openNotes},
  {id:'icon-readme',glyph:imgTag('documents',44),label:'Read Me.txt',x:20,y:220,action:()=>openTextEdit('/Documents/Notes.txt')},
  {id:'icon-trash',glyph:imgTag('trash',44),label:'Trash',x:20,y:320,action:()=>showModal({heading:'Empty Trash?',message:'Trash is currently empty.',icon:'&#128465;&#65039;',iconBg:'#8e8e93',buttons:[{label:'OK',cls:'primary'}]})}
];
const iconPos=ls_get('iconPos', {});
defaultIcons.forEach(ic=>{
  const pos=iconPos[ic.id]||{x:ic.x,y:ic.y};
  const el=document.createElement('div'); el.className='dicon'; el.id=ic.id;
  el.style.left=pos.x+'px'; el.style.top=pos.y+'px';
  el.innerHTML=`<span class="glyph">${ic.glyph}</span>${ic.label}`;
  el.ondblclick=ic.action;
  let sx,sy,ox,oy,drag=false,moved=false;
  el.addEventListener('mousedown',e=>{ drag=true; moved=false; sx=e.clientX; sy=e.clientY; ox=el.offsetLeft; oy=el.offsetTop; e.stopPropagation(); });
  window.addEventListener('mousemove',e=>{ if(!drag) return; moved=true; el.style.left=(ox+e.clientX-sx)+'px'; el.style.top=(oy+e.clientY-sy)+'px'; });
  window.addEventListener('mouseup',()=>{ if(drag&&moved){ iconPos[ic.id]={x:el.offsetLeft,y:el.offsetTop}; ls_set('iconPos',iconPos); } drag=false; });
  desktop.appendChild(el);
});

/* ---------- right-click context menu ---------- */
let ctxEl=null;
document.addEventListener('contextmenu',e=>{
  if(e.target.closest('.win')||e.target.closest('#dock')||e.target.closest('#menubar')) return;
  e.preventDefault();
  if(ctxEl) ctxEl.remove();
  ctxEl=document.createElement('div'); ctxEl.className='menu-dd';
  ctxEl.style.left=e.clientX+'px'; ctxEl.style.top=e.clientY+'px';
  ctxEl.innerHTML=`<div class="it" id="ctxOpen"><span>&#128193; Open</span></div>
  <div class="it off"><span>&#8505;&#65039; Get Info</span><span class="sc">⌘I</span></div>
  <div class="it off"><span>&#9999;&#65039; Rename</span></div><hr>
  <div class="it off"><span>&#128203; Copy</span><span class="sc">⌘C</span></div>
  <div class="it off"><span>&#128203; Paste</span><span class="sc">⌘V</span></div><hr>
  <div class="it" id="ctxNewFolder"><span>&#128449; New Folder</span><span class="sc">⌘N</span></div>
  <div class="it" id="ctxWall"><span>&#128444;&#65039; Change Wallpaper…</span></div><hr>
  <div class="it off"><span>&#128465;&#65039; Move to Trash</span></div>
  <div class="it off"><span>&#128203; Duplicate</span></div><hr>
  <div class="it" id="ctxAbout"><span>&#8505;&#65039; About OpenDesk</span></div>`;
  document.body.appendChild(ctxEl);
  ctxEl.querySelector('#ctxOpen').onclick=()=>{ openFinder('/Desktop'); ctxEl.remove(); };
  ctxEl.querySelector('#ctxWall').onclick=()=>{ openSettings('appearance'); ctxEl.remove(); };
  ctxEl.querySelector('#ctxNewFolder').onclick=()=>{ openFinder('/Desktop'); ctxEl.remove(); };
  ctxEl.querySelector('#ctxAbout').onclick=()=>{ openSettings('about'); ctxEl.remove(); };
});
document.addEventListener('click',()=>{ if(ctxEl){ ctxEl.remove(); ctxEl=null; } });

/* ---------- apply saved wallpaper / dock size / accent / brightness ---------- */
(function init(){
  const wall=ls_get('wall', null);
  if(wall) document.body.style.background=wallCSS(wall);
  const dsize=ls_get('dsize', null); if(dsize) document.documentElement.style.setProperty('--dsize', dsize+'px');
  const accent=ls_get('accent', null); if(accent) document.documentElement.style.setProperty('--accent', accent);
  const bright=ls_get('bright', null); if(bright) document.body.style.filter='brightness('+(bright/100)+')';
  if(ls_get('theme','dark')==='dark') document.body.classList.add('theme-dark');
  document.documentElement.style.setProperty('--dzoom', ls_get('dzoom',1.35));
  if(!ls_get('dzoomOn',true)) document.body.classList.add('no-dockzoom');
  if(!ls_get('dbg',true)) document.body.classList.add('no-dockbg');
  document.getElementById('menuLogo').src=IMG.logoW;
  /* after an in-browser update the old page's leftover markup can trail the new one; drop it */
  (function dedupe(){ const run=()=>['menubar','desktop','dock'].forEach(id=>{ const all=document.querySelectorAll('#'+id); for(let i=1;i<all.length;i++) all[i].remove(); }); run(); window.addEventListener('load',run); setTimeout(run,600); })();
  refreshTag();
  if(ls_get('autoUpd',true) && (location.protocol.indexOf('http')===0 || ls_get('updateUrl',''))) setTimeout(()=>checkUpdate(true),1200);
  const fl=document.createElement('link'); fl.rel='icon'; fl.href=IMG.fav; document.head.appendChild(fl);
  syncStatusIcons();
})();

/* ---------- clock ---------- */
function tick(){
  const n=new Date();
  const h=n.getHours()%12||12, m=n.getMinutes().toString().padStart(2,'0');
  const ampm=n.getHours()>=12?'PM':'AM';
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const mon=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('clock').textContent=`${days[n.getDay()]} ${mon[n.getMonth()]} ${n.getDate()}  ${h}:${m} ${ampm}`;
}
tick(); setInterval(tick,15000);

openFinder('/Documents');
</script>
